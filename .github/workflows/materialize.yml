name: Remove temporary publication transport
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'materialize')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name 'DUNEVERSE Studio'
          git config user.email 'duneverseappstudio-lab@users.noreply.github.com'
          git rm restore_source.py source-part-*.b64
          git commit -m 'Remove temporary publication transport'
          git push
